<body class="flat">
<main id="main">
<section class="opener"><div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span aria-hidden="true">/</span><a href="reviews.html">Reviews</a><span aria-hidden="true">/</span><span>Feedback</span></nav><span class="label">Feedback</span><h1>How was <em>your visit?</em></h1><p class="sub">Your rating and comments go straight to the team. We read every one.</p></div></section>
<section class="sec sm"><div class="wrap mid"><div class="box"><form class="form" id="fb" novalidate data-title="Thank you for your feedback" data-success="The team will read it. If you asked us to get in touch, we will reply within two working days.">
  <div class="form-err"></div>
  <fieldset class="rate"><legend>How was your visit?</legend><label title="1 star"><input type="radio" name="fb-r" value="1"><span class="sr">1 star</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg></label><label title="2 stars"><input type="radio" name="fb-r" value="2"><span class="sr">2 stars</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg></label><label title="3 stars"><input type="radio" name="fb-r" value="3"><span class="sr">3 stars</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg></label><label title="4 stars"><input type="radio" name="fb-r" value="4"><span class="sr">4 stars</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg></label><label title="5 stars"><input type="radio" name="fb-r" value="5"><span class="sr">5 stars</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg></label></fieldset>
  <div class="form-grid">
    <div class="field"><label for="fb-n">Your name</label><input class="input" id="fb-n" autocomplete="name" required></div>
    <div class="field"><label for="fb-e">Email</label><input class="input" id="fb-e" type="email" autocomplete="email"></div>
    <div class="field"><label for="fb-p">Phone</label><input class="input" id="fb-p" type="tel" autocomplete="tel"><span class="hint">Optional</span></div>
    <div class="field"><label for="fb-c">About</label><select class="select" id="fb-c"><option>Food</option><option>Drinks</option><option>Service</option><option>Atmosphere</option><option>Event</option><option>Online order</option><option>Something else</option></select></div>
    
    <div class="field full"><label for="fb-m">Tell us more</label><textarea class="textarea" id="fb-m" required></textarea></div>
    <label class="check full"><input type="checkbox" id="fb-ac"> You may contact me about this feedback (needs an email or phone number).</label>
    
  </div>
  <div class="acts"><button class="btn solid" type="submit">Send feedback <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</form></div><p class="small faint" style="margin-top:18px">We may publish your rating and comment on our Reviews page with your first name. We never publish contact details.</p></div></section>
</main>
